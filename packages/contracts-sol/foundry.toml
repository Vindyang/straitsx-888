[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# The registry is read on every policy decision (check 1, never cached), so
# favour cheap reads. Deploy cost is one-off and paid from a faucet balance.
via_ir = false

[rpc_endpoints]
fuji = "${RPC_URL_43113}"
mainnet = "${RPC_URL_43114}"

[etherscan]
fuji = { key = "${SNOWTRACE_API_KEY}", chain = 43113, url = "https://api.routescan.io/v2/network/testnet/evm/43113/etherscan" }
mainnet = { key = "${SNOWTRACE_API_KEY}", chain = 43114, url = "https://api.routescan.io/v2/network/mainnet/evm/43114/etherscan" }

[fmt]
line_length = 100
tab_width = 4
